<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <p class="eyebrow">BuildLab Challenge</p>
          <h1>Student Task Manager</h1>
        </div>
      </header>

      <main class="panel">
        <form id="task-form" class="task-form" novalidate>
          <label for="task-input" class="sr-only">Add a task</label>
          <input
            id="task-input"
            type="text"
            maxlength="120"
            placeholder="Add a new task..."
            aria-label="Task title"
          />
          <button type="submit" class="primary-btn">Add Task</button>
        </form>

        <p id="feedback" class="feedback" aria-live="polite"></p>

        <section class="toolbar" aria-label="Task controls">
          <div class="search-wrap">
            <label for="search-input" class="sr-only">Search tasks</label>
            <input
              id="search-input"
              type="search"
              placeholder="Search tasks..."
              aria-label="Search tasks"
            />
          </div>

          <div class="filter-group" role="group" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="pending" type="button">Pending</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </section>

        <section class="summary" aria-label="Task summary">
          <div class="summary-card">
            <span class="summary-label">Total</span>
            <strong id="total-count">0</strong>
          </div>
          <div class="summary-card">
            <span class="summary-label">Pending</span>
            <strong id="pending-count">0</strong>
          </div>
          <div class="summary-card">
            <span class="summary-label">Completed</span>
            <strong id="completed-count">0</strong>
          </div>
        </section>

        <section>
          <ul id="task-list" class="task-list" aria-live="polite"></ul>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
